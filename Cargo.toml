[package]
name = "navigator"
version = "0.1.0"
edition = "2021"
description = "A 3D directory navigator for Wayland"
publish = false

[[bin]]
name = "nav"
path = "src/main.rs"

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
cpal = "0.15"
glam = "0.29"
glyphon = "0.12"
pollster = "0.4"
serde_json = "1"
toml = "0.8"
wgpu = "30"
winit = "0.30"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
